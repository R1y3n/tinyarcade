<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="TinyArcade Multiplayer: online human versus human chess">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="0.55" stop-color="#181B21"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="420" rx="24" fill="url(#bg)"/>
  <rect width="640" height="420" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="638" height="418" rx="23" fill="none" stroke="#2A2F38" stroke-width="2"/>

  <g opacity="0.10" stroke="#6B7686" stroke-width="1">
    <path d="M0 84h640M0 168h640M0 252h640M0 336h640"/>
    <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420"/>
  </g>

  <text x="44" y="50" fill="#A78BFA" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">MULTIPLAYER · NOW AVAILABLE</text>
  <text x="44" y="100" fill="#F7F8FA" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-1.1">TinyArcade</text>
  <text x="44" y="140" fill="#F7F8FA" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-1.1">Multiplayer</text>
  <text x="44" y="171" fill="#C3CBD7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400">The board you know. A rival who isn't a bot.</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500">
    <circle cx="48" cy="212" r="4" fill="url(#accent)"/>
    <text x="62" y="217" fill="#D8DEE8">Human vs human, at last</text>
    <circle cx="48" cy="246" r="4" fill="url(#accent)"/>
    <text x="62" y="251" fill="#D8DEE8">Share a code, play online</text>
    <circle cx="48" cy="280" r="4" fill="url(#accent)"/>
    <text x="62" y="285" fill="#D8DEE8">Same tiny footprint</text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">
    <rect x="44" y="304" width="82" height="30" rx="15" fill="#1E232B" stroke="#352E46"/>
    <text x="85" y="323" text-anchor="middle">1 v 1</text>
    <rect x="134" y="304" width="98" height="30" rx="15" fill="#1E232B" stroke="#352E46"/>
    <text x="183" y="323" text-anchor="middle">human</text>
    <rect x="240" y="304" width="96" height="30" rx="15" fill="#1E232B" stroke="#352E46"/>
    <text x="288" y="323" text-anchor="middle">online</text>
  </g>

  <g transform="translate(410 44)">
    <circle cx="38" cy="58" r="52" fill="#A78BFA" opacity="0.10" filter="url(#soft)"/>
    <circle cx="142" cy="58" r="52" fill="#A78BFA" opacity="0.10" filter="url(#soft)"/>
    <circle cx="38" cy="58" r="38" fill="#F7F8FA" stroke="#D8DEE8" stroke-width="2"/>
    <circle cx="142" cy="58" r="38" fill="#2A0F4F" stroke="#A78BFA" stroke-width="2"/>
    <g transform="translate(-19.9 9.05) scale(1.1)" fill="#171A20" stroke="#171A20" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M36,80 L72,80 L69,74 L65,70 C68,53 64,40 53,37 L51.5,33 L48,37 L45.5,33 L44,39 C39.5,43 36,48 36,52 C36.5,55 41,55 48.5,53 C44.5,58 42,63 41.5,70 L37,74 Z"/>
      <path fill="none" stroke="#F7F8FA" stroke-width="1.5" d="M38,74 L70,74 M42,70 L64,70"/>
      <circle cx="44" cy="44" r="1.3" fill="#F7F8FA" stroke="none"/>
      <circle cx="39.1" cy="49.5" r="1" fill="#F7F8FA" stroke="none"/>
    </g>
    <g transform="translate(81.1 9.05) scale(1.1)" fill="#F7F8FA" stroke="#A78BFA" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M36,80 L72,80 L69,74 L65,70 C68,53 64,40 53,37 L51.5,33 L48,37 L45.5,33 L44,39 C39.5,43 36,48 36,52 C36.5,55 41,55 48.5,53 C44.5,58 42,63 41.5,70 L37,74 Z"/>
      <path fill="none" stroke="#2A0F4F" stroke-width="1.5" d="M38,74 L70,74 M42,70 L64,70"/>
      <circle cx="44" cy="44" r="1.3" fill="#2A0F4F" stroke="none"/>
      <circle cx="39.1" cy="49.5" r="1" fill="#2A0F4F" stroke="none"/>
    </g>
    <circle cx="90" cy="58" r="16" fill="#0A0C0F" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="90" y="63" fill="#C4B5FD" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle">VS</text>
    <text x="38" y="115" fill="#8D97A8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">YOU</text>
    <text x="142" y="115" fill="#8D97A8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">RIVAL</text>
    <path d="M66 132 C82 150 98 150 114 132" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.65"/>
    <circle cx="90" cy="147" r="4" fill="#A78BFA" opacity="0.9"/>
    <text x="90" y="181" fill="#8D97A8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2.4" text-anchor="middle">TWO MINDS · ONE BOARD</text>
  </g>

  <line x1="44" y1="354" x2="596" y2="354" stroke="#2A2F38" stroke-width="1"/>
  <text x="44" y="384" fill="#8D97A8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8">REST + SSE · NO FIREBASE SDK</text>
  <text x="596" y="384" fill="#A78BFA" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" text-anchor="end">TINYARCADE MULTIPLAYER</text>
</svg>
