<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Power of 4: an incoming TinyChess game with local and online multiplayer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="0.55" stop-color="#181B21"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#E2B33C" stop-opacity="0.23"/>
      <stop offset="0.55" stop-color="#E2B33C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2CE6B"/>
      <stop offset="1" stop-color="#C8921D"/>
    </linearGradient>
    <clipPath id="p4clip">
      <rect width="196" height="168" rx="16"/>
    </clipPath>
    <pattern id="holes" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="11" fill="#080B0E"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="640" height="420" rx="24" fill="url(#bg)"/>
  <rect width="640" height="420" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="638" height="418" rx="23" fill="none" stroke="#2A2F38" stroke-width="2"/>

  <g opacity="0.10" stroke="#6B7686" stroke-width="1">
    <path d="M0 84h640M0 168h640M0 252h640M0 336h640"/>
    <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420"/>
  </g>

  <text x="44" y="50" fill="#E2B33C" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">INCOMING · GAME 03</text>
  <text x="44" y="112" fill="#F7F8FA" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">Power of 4</text>
  <text x="44" y="143" fill="#C3CBD7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400">Drop. Connect. Own the grid.</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="500">
    <circle cx="48" cy="194" r="4" fill="url(#accent)"/>
    <text x="62" y="199" fill="#D8DEE8">Local &amp; online multiplayer</text>
    <circle cx="48" cy="228" r="4" fill="url(#accent)"/>
    <text x="62" y="233" fill="#D8DEE8">Simple rules, ruthless tactics</text>
    <circle cx="48" cy="262" r="4" fill="url(#accent)"/>
    <text x="62" y="267" fill="#D8DEE8">No luck. No bloat.</text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#F2CE6B">
    <rect x="44" y="294" width="82" height="30" rx="15" fill="#1E232B" stroke="#3A3528"/>
    <text x="85" y="313" text-anchor="middle">7 × 6</text>
    <rect x="134" y="294" width="98" height="30" rx="15" fill="#1E232B" stroke="#3A3528"/>
    <text x="183" y="313" text-anchor="middle">4 in a row</text>
    <rect x="240" y="294" width="96" height="30" rx="15" fill="#1E232B" stroke="#3A3528"/>
    <text x="288" y="313" text-anchor="middle">2 players</text>
  </g>

  <g transform="translate(394 48)">
    <ellipse cx="98" cy="180" rx="94" ry="11" fill="#000000" opacity="0.38" filter="url(#soft)"/>
    <g clip-path="url(#p4clip)">
      <rect width="196" height="168" fill="#14202C"/>
      <rect width="196" height="168" fill="url(#holes)"/>
      <circle cx="42" cy="154" r="9.5" fill="#E2B33C" stroke="#F2CE6B" stroke-width="1.5"/>
      <circle cx="70" cy="154" r="9.5" fill="#E2B33C" stroke="#F2CE6B" stroke-width="1.5"/>
      <circle cx="98" cy="154" r="9.5" fill="#E2B33C" stroke="#F2CE6B" stroke-width="1.5"/>
      <circle cx="126" cy="154" r="9.5" fill="#E2B33C" stroke="#F2CE6B" stroke-width="1.5"/>
      <circle cx="70" cy="126" r="9.5" fill="#EC6A5C" stroke="#F59E93" stroke-width="1.5"/>
      <circle cx="98" cy="126" r="9.5" fill="#EC6A5C" stroke="#F59E93" stroke-width="1.5"/>
      <circle cx="154" cy="126" r="9.5" fill="#E2B33C" stroke="#F2CE6B" stroke-width="1.5"/>
      <circle cx="126" cy="98" r="9.5" fill="#EC6A5C" stroke="#F59E93" stroke-width="1.5"/>
      <circle cx="98" cy="70" r="9.5" fill="#E2B33C" stroke="#F2CE6B" stroke-width="1.5"/>
      <circle cx="42" cy="98" r="9.5" fill="#EC6A5C" stroke="#F59E93" stroke-width="1.5"/>
      <circle cx="154" cy="70" r="9.5" fill="#EC6A5C" stroke="#F59E93" stroke-width="1.5"/>
    </g>
    <rect x="0.5" y="0.5" width="195" height="167" rx="16" fill="none" stroke="#2A3B4D" stroke-width="2"/>
    <path d="M42 171 L126 171" stroke="#F2CE6B" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <text x="98" y="198" fill="#8D97A8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2.4" text-anchor="middle">FOUR IN A ROW WINS</text>
  </g>

  <line x1="44" y1="346" x2="596" y2="346" stroke="#2A2F38" stroke-width="1"/>
  <text x="44" y="378" fill="#8D97A8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8">INCOMING FEATURE · NOT IN THE CURRENT APK</text>
  <text x="596" y="378" fill="#E2B33C" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" text-anchor="end">TINYCHESS ROADMAP</text>
</svg>
